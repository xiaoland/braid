name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo clippy --locked -- -D warnings

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
