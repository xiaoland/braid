name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust
            os: macos-15
            target: aarch64-apple-darwin
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: node --test native/pi/tests/*.test.mjs
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Verify OTLP internal diagnostics stay out of ordinary logs
        if: matrix.name == 'linux'
        run: cargo test --locked --bin braid --features opentelemetry-otlp/internal-logs telemetry::tests
