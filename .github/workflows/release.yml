name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.3.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.0 --profile minimal --target ${{ matrix.target }}
      - run: cargo build --locked --release
      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          package="braid-${version}-${{ matrix.target }}"
          rm -rf "$package" "${package}.tar.gz" "${package}.tar.gz.sha256"
          mkdir -p "$package"
          cp target/release/braid "$package/braid"
          cp LICENSE README.md config.example.toml "$package/"
          tar -czf "${package}.tar.gz" "$package"
          shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            braid-*.tar.gz
            braid-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.version || github.ref_name }}"
          version="${tag#v}"
          awk -v section="## [${version}]" '
            $0 == section { include = 1; next }
            include && /^## \[/ { exit }
            include { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          assets=(dist/release-*/*.tar.gz dist/release-*/*.tar.gz.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes-file release-notes.md
          fi
