name: release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package.sh'
      - 'scripts/verify-package.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'config.example.toml'
      - 'deploy/otel-collector.example.yaml'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.3.3)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - run: rustup toolchain install 1.93.0 --profile minimal --target ${{ matrix.target }}
      - name: Package release artifact
        shell: bash
        env:
          BRAID_BUILD_TARGET: ${{ matrix.target }}
          BRAID_RELEASE_TAG: ${{ github.event.inputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          if [[ -z "$BRAID_RELEASE_TAG" ]]; then
            BRAID_RELEASE_TAG=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          fi
          scripts/package.sh
          scripts/verify-package.sh dist "$BRAID_RELEASE_TAG" "$BRAID_BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/braid-*.tar.gz
            dist/braid-*.tar.gz.sha256
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          awk -v section="[${version}]" '
            $1 == "##" && $2 == section { include = 1; next }
            include && /^## \[/ { exit }
            include { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          assets=(dist/release-*/*.tar.gz dist/release-*/*.tar.gz.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes-file release-notes.md
          fi
