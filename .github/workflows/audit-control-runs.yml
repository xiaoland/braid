name: Audit preservation controls
on:
  pull_request:
    paths: ['.github/audit-controls/**', '.github/workflows/audit-control-runs.yml']
permissions:
  contents: read
jobs:
  control:
    if: github.head_ref == 'feat/pr149-test-audit'
    strategy:
      fail-fast: false
      matrix:
        owner: [unassignment, ops-extra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - if: matrix.owner == 'native'
        run: |
          node native/pi/install.mjs "$RUNNER_TEMP/pi" --plugins background
          echo "BRAID_TEST_PI_INSTALL=$RUNNER_TEMP/pi" >> "$GITHUB_ENV"
      - env:
          OWNER: ${{ matrix.owner }}
          CARGO_PROFILE_DEV_DEBUG: 0
        run: bash ".github/audit-controls/ci-$OWNER.sh"
