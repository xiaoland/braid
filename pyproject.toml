[project]
name = "github-agent-bridge"
version = "0.1.0"
description = "Transport runtime for GitHub and a coding-agent provider"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11,<4",
    "pydantic>=2.10,<3",
    "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
test = [
    "pytest>=8.3,<9",
]

[project.scripts]
github-agent-bridge = "github_agent_bridge.cli:entrypoint"

[build-system]
requires = ["pdm-backend>=2.4,<3"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
test = "pytest"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
