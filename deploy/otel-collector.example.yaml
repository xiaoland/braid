# Run with compose.observability.yaml; private container network only.
# Braid -> Collector -> queryable LGTM. No second sampling decision.
# Outside Compose, replace lgtm with an explicitly authorized OTLP backend,
# bind receivers to loopback, and configure TLS/auth for non-loopback transport.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318
    # Logs contain complete sensitive evidence. Never use a debug exporter.

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/lgtm]
