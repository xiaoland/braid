auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

# Full evidence lives in OTLP log attributes (Loki structured metadata).
# Loki's default 64KB metadata limit rejects ordinary long tool results.
# Reject oversized records explicitly; never truncate retained evidence.
limits_config:
  max_structured_metadata_size: 64MB
  max_structured_metadata_entries_count: 4096
  max_line_size: 16MB
  max_line_size_truncate: false
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  retention_period: 24h

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
