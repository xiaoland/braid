[package]
name = "braid"
version = "0.2.3"
edition = "2024"
rust-version = "1.93"
description = "GitHub working memory for local coding agents"
license = "MIT"
repository = "https://github.com/xiaoland/braid"
publish = false

[[bin]]
name = "braid"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
comrak = { version = "0.54", default-features = false }
fs2 = "0.4"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "10.4", features = ["use_pem"] }
opentelemetry = { version = "0.32", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["logs", "metrics", "trace"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["serde", "v7"] }
async-trait = "0.1.92"
rand = "0.10.2"
dirs = "6.0.0"
which = "8.0.5"
octocrab = "0.54.1"
git2 = "0.21.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
